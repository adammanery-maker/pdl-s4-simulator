# fly.toml app configuration file generated for pdl-s4-simulator on 2026-11-03T19:02:24-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pdl-s4-simulator'
primary_region = 'ord'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  BELIEF_PATH = '/app/foul-play/pdl-belief-all-teams.json'
  BIND_HOST = '0.0.0.0'
  FOUL_ROOT = '/app/foul-play'
  NODE_ENV = 'production'
  PANEL_PORT = '4173'
  PANEL_TEAM_PATH = '/tmp/pdl-foul-play-control-team.txt'
  PYTHON_BIN = 'python3'
  SHOWDOWN_HOST = 'localhost'
  SHOWDOWN_PORT = '8000'

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 35

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/status'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
